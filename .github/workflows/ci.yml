name: Woact Stage 5

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: JavaScript policy tests
        run: npm test
      - name: PHP settings and policy tests
        run: for test_file in tests/php/*.php; do php "$test_file"; done
      - name: PHP syntax
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Stage structure
        run: npm run validate
      - name: Build installable packages
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: woact-stage5-0.5.2-rc1
          path: build/*.zip

